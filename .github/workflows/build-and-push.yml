# Build ảnh Docker cho box ARM rồi đẩy lên GHCR. Watchtower trên box tự kéo về.
#
# Vì sao build ở đây chứ không build trên box: CPU của box là Cortex-A53 bốn nhân,
# build một ảnh Python mất hàng chục phút và làm treo cả AdGuard đang chạy cùng máy.
name: Build & push image

on:
  push:
    branches: [main, develop_crawl]
    # Sửa README hay tài liệu thì không cần build lại ảnh.
    paths-ignore: ["**.md", "docs/**", "plans/**"]
  workflow_dispatch:

concurrency:
  # Đẩy hai commit liền nhau thì bỏ lượt build cũ — chỉ ảnh mới nhất mới có ích.
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Test chạy TRƯỚC khi build: đẩy ảnh hỏng lên GHCR là 30 phút sau box tự
      # kéo về và thay bản đang chạy tốt.
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Box là aarch64 còn runner là x86. QEMU để build chéo sang arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Chỉ arm64 — không có máy x86 nào chạy cái này, build thêm amd64 là
          # gấp đôi thời gian cho một ảnh không ai kéo.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
